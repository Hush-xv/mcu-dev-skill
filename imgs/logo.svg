<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-label="mcu-dev-skill">
  <rect width="720" height="200" rx="18" fill="#0f172a"/>

  <!-- chip body -->
  <rect x="52" y="56" width="88" height="88" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="96" cy="100" r="11" fill="#38bdf8"/>

  <!-- chip pins: top / bottom / left / right -->
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
    <line x1="68" y1="56" x2="68" y2="38"/><line x1="84" y1="56" x2="84" y2="38"/>
    <line x1="100" y1="56" x2="100" y2="38"/><line x1="116" y1="56" x2="116" y2="38"/>
    <line x1="68" y1="144" x2="68" y2="162"/><line x1="84" y1="144" x2="84" y2="162"/>
    <line x1="100" y1="144" x2="100" y2="162"/><line x1="116" y1="144" x2="116" y2="162"/>
    <line x1="52" y1="72" x2="34" y2="72"/><line x1="52" y1="88" x2="34" y2="88"/>
    <line x1="52" y1="104" x2="34" y2="104"/><line x1="52" y1="120" x2="34" y2="120"/>
    <line x1="140" y1="72" x2="158" y2="72"/><line x1="140" y1="88" x2="158" y2="88"/>
    <line x1="140" y1="104" x2="158" y2="104"/><line x1="140" y1="120" x2="158" y2="120"/>
  </g>

  <!-- wordmark -->
  <text x="186" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="46" font-weight="bold" fill="#f1f5f9">mcu-dev-skill</text>
  <text x="188" y="136" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#94a3b8">文档驱动的 MCU 固件开发技能包 · ZCode 插件</text>

  <!-- phase strip -->
  <g font-family="sans-serif" font-size="14" fill="#38bdf8" text-anchor="middle">
    <text x="188" y="172">环境分析</text>
    <text x="288" y="172">手册精读</text>
    <text x="388" y="172">编码</text>
    <text x="470" y="172">硬件评审</text>
    <text x="576" y="172">构建门禁</text>
  </g>
  <g stroke="#334155" stroke-width="2">
    <line x1="248" y1="167" x2="262" y2="167"/><line x1="348" y1="167" x2="362" y2="167"/>
    <line x1="428" y1="167" x2="442" y2="167"/><line x1="522" y1="167" x2="536" y2="167"/>
  </g>
</svg>
